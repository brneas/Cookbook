name: cookbook
description: "An unofficial open-source Flutter client for the Nextcloud Cookbook app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  package_info_plus: 10.2.1
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: 17.0.0
  sqflite: ^2.4.4
  flutter_secure_storage: ^11.1.1
  url_launcher: ^6.3.2
  path: ^1.9.1
  flutter_local_notifications: 22.3.1
  wakelock_plus: 1.8.0
  timezone: 0.11.0
  flutter_markdown_plus: 1.0.12
  markdown: ^7.3.1
  xml: ^7.0.1
  diacritic: 0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:

  uses-material-design: true
